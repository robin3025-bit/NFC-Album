<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFC 앨범 기술 검증 V0.1</title><style>body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#182331;margin:0}main{max-width:680px;margin:auto;padding:20px}section{background:white;border:1px solid #dbe2e8;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:24px}h2{font-size:19px}label{display:block;margin:12px 0}input:not([type=checkbox]),button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aab6c1;border-radius:8px;font:inherit}button{background:#145c78;color:white;cursor:pointer;margin:5px 0}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}img,video,audio{max-width:100%;width:100%;margin:8px 0}a{overflow-wrap:anywhere}small{color:#526273} [hidden]{display:none!important}</style></head><body><main><h1>NFC 앨범 · 기술 검증 V0.1</h1><section id="builder"><h2>1. 구글 계정 연결</h2><button id="login" disabled>Google 계정 연결</button><p id="auth">인증 모듈 불러오는 중</p><h2>2. 테스트 자료 선택</h2><label>앨범 제목<input id="title" value="나의 테스트 앨범" maxlength="100"></label><label>음악·사진·영상 파일<input id="files" type="file" accept="audio/*,image/*,video/*" multiple></label><p><small>테스트용 파일만 선택하세요. 파일당 20MB 이하, 총 50MB 이하.</small></p><h2>3. 공개 앨범 생성</h2><label><input id="consent" type="checkbox"> 선택한 자료와 앨범 설정을 링크가 있는 모든 사람이 볼 수 있도록 공개하는 데 동의합니다.</label><button id="create" disabled>폴더 생성 및 업로드</button><div id="result"></div></section><section id="viewer" hidden><h2 id="albumTitle">4. 공개 감상 테스트</h2><label>발급받은 API 키<input id="key" type="password" autocomplete="off" placeholder="API 키 붙여넣기"></label><button id="load">앨범 불러오기</button><small>API 키는 주소나 설정 파일에 저장하지 않습니다. 이 검증 단계에서는 감상 브라우저에서도 직접 입력합니다.</small><div id="media"></div></section><section><h2>진행 기록</h2><pre id="log" aria-live="polite">페이지 시작</pre></section></main><script>
'use strict';const $=id=>document.getElementById(id), BASE='https://www.googleapis.com/drive/v3', CLIENT='565864811500-6i7upp4iml1e9n5g4rjllqr38011t1cu.apps.googleusercontent.com';let token='',client,busy=false;const albumId=new URL(location.href).searchParams.get('album');function log(s){$('log').textContent+='\n'+s}function refresh(){ $('create').disabled=busy||!token||!$('files').files.length||!$('consent').checked; }function fail(e){log('오류: '+e.message)}async function request(url,options={},auth=true){const headers=new Headers(options.headers||{});if(auth)headers.set('Authorization','Bearer '+token);const r=await fetch(url,{...options,headers});if(!r.ok){let msg=await r.text();try{msg=JSON.parse(msg).error.message}catch{}throw Error(r.status+' '+msg.slice(0,350))}return r}async function json(url,options={},auth=true){return (await request(url,options,auth)).json()}const post=(obj)=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});async function share(id){await json(BASE+'/files/'+encodeURIComponent(id)+'/permissions',post({type:'anyone',role:'reader'}))}async function upload(name,type,blob,parent){const boundary='nfc_'+crypto.randomUUID();const metadata={name,mimeType:type,parents:[parent]};const body=new Blob(['--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',JSON.stringify(metadata),'\r\n--'+boundary+'\r\nContent-Type: '+type+'\r\n\r\n',blob,'\r\n--'+boundary+'--\r\n']);return json('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,resourceKey',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body})}function kind(f){if(f.type.startsWith('audio/'))return 'audio';if(f.type.startsWith('image/'))return 'img';if(f.type.startsWith('video/'))return 'video';return ''}window.gisReady=()=>{try{client=google.accounts.oauth2.initTokenClient({client_id:CLIENT,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error){log('인증 실패: '+r.error);return}token=r.access_token;$('auth').textContent='권한 승인 완료';log('Google 계정 연결 성공');refresh()},error_callback:e=>log('인증 창 오류: '+e.type)});$('login').disabled=false;$('auth').textContent='연결 가능'}catch(e){fail(e)}};$('login').onclick=()=>client.requestAccessToken({prompt:'select_account'});$('files').onchange=refresh;$('consent').onchange=refresh;
$('create').onclick=async()=>{const files=[...$('files').files];if(!files.length||!files.every(f=>kind(f)&&f.size<=20*1024*1024)||files.reduce((s,f)=>s+f.size,0)>50*1024*1024){log('지원되는 미디어 파일 및 용량을 확인하세요.');return}busy=true;refresh();$('result').replaceChildren();try{const folder=await json(BASE+'/files?fields=id',post({name:'NFC_TEST_'+new Date().toISOString().replace(/[:.]/g,'-'),mimeType:'application/vnd.google-apps.folder'}));log('폴더 생성 성공: '+folder.id);const items=[];for(const f of files){const item=await upload(f.name,f.type,f,folder.id);log('업로드 성공: '+f.name);await share(item.id);log('공유 설정 성공: '+f.name);items.push({id:item.id,name:f.name,type:kind(f),resourceKey:item.resourceKey||''})}const config=await upload('album.json','application/json',new Blob([JSON.stringify({version:1,title:$('title').value,items})]),folder.id);await share(config.id);const url=new URL(location.href);url.search='';url.searchParams.set('album',config.id);if(config.resourceKey)url.searchParams.set('rk',config.resourceKey);const a=document.createElement('a');a.href=url.href;a.textContent=url.href;a.target='_blank';a.rel='noopener';$('result').append('앨범 생성 성공! 아래 주소를 복사하여 시크릿 창에서 열어보세요.',document.createElement('br'),a);log('설정 저장 및 주소 생성 성공')}catch(e){fail(e);log('실패 전에 생성된 파일은 Drive에 남을 수 있습니다.')}finally{busy=false;refresh()}};
function mediaUrl(id,key,rk){const u=new URL(BASE+'/files/'+encodeURIComponent(id));u.searchParams.set('alt','media');u.searchParams.set('key',key);if(rk)u.searchParams.set('resourceKey',rk);return u}if(albumId){$('builder').hidden=true;$('viewer').hidden=false}else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=window.gisReady;s.onerror=()=>log('Google 인증 모듈 로딩 실패');document.head.append(s)}$('load').onclick=async()=>{const key=$('key').value.trim();if(!key){log('API 키를 입력하세요.');return}$('load').disabled=true;$('media').replaceChildren();try{const config=await json(mediaUrl(albumId,key,new URL(location.href).searchParams.get('rk')),{},false);if(config.version!==1||!Array.isArray(config.items))throw Error('설정 파일 형식 오류');$('albumTitle').textContent=config.title||'앨범';log('공개 설정파일 읽기 성공');for(const item of config.items){if(!['audio','video','img'].includes(item.type))continue;const p=document.createElement('p');p.textContent=item.name;$('media').append(p);const el=document.createElement(item.type);if(item.type!=='img'){el.controls=true;el.preload='metadata';el.onloadedmetadata=()=>log('미디어 정보 로딩 성공: '+item.name);el.onplaying=()=>log('재생 시작: '+item.name)}else{el.alt=item.name;el.onload=()=>log('사진 표시 성공: '+item.name)}el.onerror=()=>log('미디어 로딩 실패: '+item.name);el.src=mediaUrl(item.id,key,item.resourceKey).href;$('media').append(el)}}catch(e){fail(e)}finally{$('load').disabled=false}};
</script></body></html>
