<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>나만의 음악 앨범</title>
<link rel="stylesheet" href="./style.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<header id="header"><div><strong>나만의 음악 앨범</strong><span>앨범 제작 도구 · V0.2</span></div><button id="login">Google 계정 연결</button></header>
<main id="layout">
<form id="editor" hidden>
<section>
<h1>앨범 만들기</h1>
<label for="saved">기존 앨범</label>
<div class="row"><select id="saved" disabled><option value="">저장한 앨범 선택</option></select><button id="open" type="button" disabled>열기</button><button id="new" type="button">새 앨범</button></div>
<label for="title">앨범 제목</label>
<input id="title" maxlength="120" placeholder="앨범 제목을 입력하세요" required>
</section>
<section><h2>음악</h2><p class="limits">파일당 20MB, 앨범에 새로 추가하는 파일은 합계 50MB까지 가능합니다.</p><label class="upload">음악 파일 추가<input type="file" id="tracks" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" multiple></label><ul class="files" id="track-list"></ul></section>
<section><h2>사진</h2><label class="upload">사진 파일 추가<input type="file" id="photos" accept="image/*" multiple></label><ul class="files" id="photo-list"></ul></section>
<section><h2>디자인 테마</h2><div id="themes"></div></section>
<section><label class="check"><input type="checkbox" id="share"> 이 앨범의 제목, 사진, 음악을 링크가 있는 누구나 열 수 있도록 공유합니다.</label><button class="primary" id="save" type="submit">내 Google Drive에 저장</button><div class="row" id="link-row" hidden><input id="link" aria-label="감상 링크" readonly><button id="copy" type="button">복사</button></div></section>
</form>
<aside id="preview" hidden><p class="preview-label">모바일 실시간 미리보기</p><div id="player"></div></aside>
</main>
<form id="viewer-key" hidden><label for="key">Drive API 키</label><div class="row"><input id="key" type="password" autocomplete="off" required><button type="submit">앨범 불러오기</button></div></form>
<p id="status" role="status"></p>
</body>
</html>
